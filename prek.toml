# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.0"
# addons/ holds GUT, and GUST-FONT-LICENSE.txt is a published license text.
# Both are third-party files, kept exactly as they ship, trailing whitespace
# included.
exclude = "^(.*/.*_vendor/|addons/|assets/fonts/GUST-FONT-LICENSE\\.txt$)"
default_language_version = { python = "python3.14" }

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.15"
hooks = [
  {
    id = "ruff-check",
    args = [
      "--fix",
    ]
  },
  { id = "ruff-format" }
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "godot-sidecars"
name = "Godot sidecars are staged or tracked"
language = "system"
entry = "uv run check_godot_sidecars"

[[repos.hooks]]
id = "gd-parse"
name = "Staged .gd files parse"
language = "system"
entry = "uv run check_gd_parse"
files = "\\.gd$"

[[repos.hooks]]
id = "agent-doc-paths"
name = "Paths in the agent docs exist"
language = "system"
entry = "uv run check_doc_paths"
# The --not-a-path spans read as paths but name things outside the repo: a
# jpexs source file, two Godot project settings, two files in Godot's user
# folder, two files the agent-skills commands default to that this repo does
# not use, tasks/plan.md (a git-ignored scratch file that /agent-skills:plan
# writes), and the GitHub repo name.
args = [
  "AGENTS.md",
  "CODING_STANDARDS.md",
  "docs/agents",
  "--not-a-path=Timeline.java",
  "--not-a-path=gui/common/snap_controls_to_pixels",
  "--not-a-path=rendering/2d/snap/snap_2d_transforms_to_pixel",
  "--not-a-path=achievements.cfg",
  "--not-a-path=achievements.cfg.bak",
  "--not-a-path=SPEC.md",
  "--not-a-path=tasks/todo.md",
  "--not-a-path=tasks/plan.md",
  "--not-a-path=julian-perge/urchin",
]
pass_filenames = false
always_run = true

[[repos.hooks]]
id = "avoid-terms"
name = "Added lines use no GLOSSARY.md _Avoid_ term"
language = "system"
entry = "uv run check_avoid_terms"
files = "\\.(md|gd)$"
# A whole-word check cannot tell which sense of a word a line means, so it
# skips these terms. The glossary defines Screen, Window, Companion, Stage,
# Quirk, Original bug and Floating number as terms of their own. Party roster,
# Failure and Rewards each name a real thing, as their _Avoid_ lines say. The
# rest are plain English or Godot words that the docs and comments use in
# their ordinary sense, each more than 10 times.
args = [
  "--allow=Screen",
  "--allow=Window",
  "--allow=Companion",
  "--allow=Stage",
  "--allow=Quirk",
  "--allow=Original bug",
  "--allow=Floating number",
  "--allow=Party roster",
  "--allow=Failure",
  "--allow=Rewards",
  "--allow=Background",
  "--allow=blow",
  "--allow=Box",
  "--allow=canvas",
  "--allow=Cast",
  "--allow=column",
  "--allow=Glow",
  "--allow=Hit",
  "--allow=menu",
  "--allow=outcome",
  "--allow=Overlay",
  "--allow=page",
  "--allow=Return",
  "--allow=round",
  "--allow=Scene",
  "--allow=Source",
  "--allow=start",
  "--allow=Turn",
  "--allow=type",
  "--allow=Viewport",
]
