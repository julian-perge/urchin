# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.0"
exclude = "^.*/.*_vendor/"
default_language_version = { python = "python3.14" }

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.15"
hooks = [
  {
    id = "ruff-check",
    args = [
      "--fix",
    ]
  },
  { id = "ruff-format" }
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "godot-sidecars"
name = "Godot sidecars are staged or tracked"
language = "system"
entry = "uv run check_godot_sidecars"

[[repos.hooks]]
id = "agent-doc-paths"
name = "Paths in the agent docs exist"
language = "system"
entry = "uv run check_doc_paths"
# The --not-a-path spans read as paths but name things outside the repo: a
# jpexs source file, two Godot project settings, a glossary map the domain doc
# reads only when it exists, and two files in Godot's user folder.
args = [
  "AGENTS.md",
  "CODING_STANDARDS.md",
  "docs/agents",
  "--not-a-path=Timeline.java",
  "--not-a-path=gui/common/snap_controls_to_pixels",
  "--not-a-path=rendering/2d/snap/snap_2d_transforms_to_pixel",
  "--not-a-path=GLOSSARY-MAP.md",
  "--not-a-path=achievements.cfg",
  "--not-a-path=achievements.cfg.bak",
]
pass_filenames = false
always_run = true
