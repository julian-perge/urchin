[build-system]
requires = ["uv_build>=0.10,<1"]
build-backend = "uv_build"

[project]
name = "urchin"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4"
authors = [{ name = "Julian Perge", email = "julianperge@gmail.com" }]
readme = "README.md"

dependencies = [
  "msgspec>=0.21.1",
  # portrait/face compositing in conversion_scripts/swf_extraction
  "pillow>=11.0",
  "ruff>=0.15.15",
]

[project.scripts]
convert_battles = "conversion_scripts.convert_battles:main"
convert_buffs = "conversion_scripts.convert_buffs:main"
convert_items = "conversion_scripts.convert_items:main"
convert_moves = "conversion_scripts.convert_moves:main"
convert_units = "conversion_scripts.convert_units:main"
export_swf_sources = "conversion_scripts.swf_extraction.export_swf_sources:main"
extract_ability_icons = "conversion_scripts.swf_extraction.extract_ability_icons:main"
extract_doll_art = "conversion_scripts.swf_extraction.extract_doll_art:main"
extract_doll_offsets = "conversion_scripts.swf_extraction.extract_doll_offsets:main"
extract_faces = "conversion_scripts.swf_extraction.extract_faces:main"
extract_item_icons = "conversion_scripts.swf_extraction.extract_item_icons:main"
extract_item_looks = "conversion_scripts.swf_extraction.extract_item_looks:main"
extract_model1_animations = "conversion_scripts.swf_extraction.extract_model1_animations:main"
extract_start_screens = "conversion_scripts.swf_extraction.extract_start_screens:main"

[tool.uv]
# A build system is declared above, so uv would package this project by
# default anyway - explicit here because entry points (the uv run
# <script-name> commands above) require it, and `false` would silently
# disable them regardless of the build-system table.
package = true

[tool.uv.build-backend]
module-name = "conversion_scripts"
module-root = ""

[tool.ruff]
fix = false
preview = false
indent-width = 4
line-length = 88
target-version = "py314"
# Show fixes in output for transparency
show-fixes = true
# In addition to the standard set of exclusions, omit all tests, plus a specific file.
extend-exclude = []

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
skip-magic-trailing-comma = true
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
fixable = ["ALL"]
# Whether to allow rules to add from __future__ import annotations in cases where this
# would simplify a fix or enable a new diagnostic.
future-annotations = true

extend-select = [
  "I",
  "FURB",
  "PTH",
  "UP",
]

ignore = [
  "RUF046",

  "E402",
  # ---------- FORMATTER COMPATIBILITY ----------
  # Rules that conflict with ruff formatter - per official recommendation
  "W191", # Indentation contains tabs
  "E111", # Indentation is not a multiple of 4
  "E114", # Indentation is not a multiple of 4 (comment)
  "E117", # Over-indented
  "Q000", # Single quotes found but double quotes preferred
  "Q001", # Single quote multiline found but double quotes preferred
  "Q002", # Single quote docstring found but double quotes preferred
  "Q003", # Change outer quotes to avoid escaping inner quotes
  "COM812", # Missing trailing comma
  "COM819", # Prohibited trailing comma
  "E501", # Line too long (handled by formatter)

  # ---------- LEGACY CODE COMPATIBILITY ----------
  "B904", # Exception handlers without from clause (acceptable pattern)
  "F841", # Variable assigned but never used (debugging artifacts)
  "E402",
]

[tool.ruff.lint.isort]
# Import sorting and organization
required-imports = ["from __future__ import annotations"]
combine-as-imports = true
split-on-trailing-comma = false
