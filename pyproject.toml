[build-system]
requires = ["uv_build>=0.10,<1"]
build-backend = "uv_build"

[project]
name = "urchin-dev"
version = "0.1.0"
description = ""
requires-python = ">=3.14,<4"
authors = [{ name = "Julian Perge", email = "julianperge@gmail.com" }]
readme = "README.md"

dependencies = [
  "msgspec>=0.21.1",
  # portrait/face compositing in dev/urchin_dev/swf
  "pillow>=11.0",
  "ruff>=0.15.15",
]

[project.scripts]
convert_battles = "urchin_dev.convert.battles:main"
convert_buffs = "urchin_dev.convert.buffs:main"
convert_items = "urchin_dev.convert.items:main"
convert_moves = "urchin_dev.convert.moves:main"
convert_units = "urchin_dev.convert.units:main"
export_swf_sources = "urchin_dev.swf.export_swf_sources:main"
extract_ability_icons = "urchin_dev.swf.extract.ability_icons:main"
extract_buff_icons = "urchin_dev.swf.extract.buff_icons:main"
extract_cutscenes = "urchin_dev.swf.extract.cutscenes:main"
extract_doll_art = "urchin_dev.swf.extract.doll_art:main"
extract_doll_offsets = "urchin_dev.swf.extract.doll_offsets:main"
extract_faces = "urchin_dev.swf.extract.faces:main"
extract_item_icons = "urchin_dev.swf.extract.item_icons:main"
extract_item_looks = "urchin_dev.swf.extract.item_looks:main"
extract_model1_animations = "urchin_dev.swf.extract.model1_animations:main"
extract_start_screens = "urchin_dev.swf.extract.start_screens:main"
extract_vfx = "urchin_dev.swf.extract.vfx:main"
extract_vfx_offsets = "urchin_dev.swf.extract.vfx_offsets:main"

[tool.uv]
# A build system is declared above, so uv would package this project by
# default anyway - explicit here because entry points (the uv run
# <script-name> commands above) require it, and `false` would silently
# disable them regardless of the build-system table.
package = true

[tool.uv.build-backend]
module-root = "dev"
source-include = ["dev/urchin_dev/**"]

[tool.ruff]
fix = false
preview = false
indent-width = 4
line-length = 88
target-version = "py314"
# Show fixes in output for transparency
show-fixes = true
# In addition to the standard set of exclusions.
extend-exclude = [
  "*.md",
  ".godot",
  ".recall",
  "addons",
  "assets",
  "docs",
  "references",
  "resources",
  "scenes",
  "scripts",
  "source_files",
]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
skip-magic-trailing-comma = true
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
fixable = ["ALL"]
# Whether to allow rules to add from __future__ import annotations in cases where this
# would simplify a fix or enable a new diagnostic.
future-annotations = true

extend-select = [
  "I",
  "FURB",
  "PTH",
  "UP",
]

ignore = [
  "RUF046",
  "PLW1510",
  "E402",
  # ---------- FORMATTER COMPATIBILITY ----------
  # Rules that conflict with ruff formatter - per official recommendation
  "W191", # Indentation contains tabs
  "E111", # Indentation is not a multiple of 4
  "E114", # Indentation is not a multiple of 4 (comment)
  "E117", # Over-indented
  "Q000", # Single quotes found but double quotes preferred
  "Q001", # Single quote multiline found but double quotes preferred
  "Q002", # Single quote docstring found but double quotes preferred
  "Q003", # Change outer quotes to avoid escaping inner quotes
  "COM812", # Missing trailing comma
  "COM819", # Prohibited trailing comma
  "E501", # Line too long (handled by formatter)

  # ---------- LEGACY CODE COMPATIBILITY ----------
  "B904", # Exception handlers without from clause (acceptable pattern)
  "F841", # Variable assigned but never used (debugging artifacts)
  "E402",
]

[tool.ruff.lint.isort]
# Import sorting and organization
required-imports = ["from __future__ import annotations"]
combine-as-imports = true
split-on-trailing-comma = false
